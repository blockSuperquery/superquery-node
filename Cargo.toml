# SuperQuery Node — Rust workspace
#
# Layout and crate responsibilities follow
# `.claude/docs/SUPERQUERY_NODE_IMPLEMENTATION_GUIDE.md` §5.
#
# Dependency direction (enforced by these manifests):
#
#   chain-api  <- core, dispatcher, chains/*, bins
#   config     <- store, core, bins
#   store      <- core, dispatcher, bins
#   runtime    <- core, bins
#   core       <- dispatcher, bins
#   chains/*   <- bins only
#
# Hard invariant (guide Milestone 3): `superquery-core` must never depend on a
# chain SDK. `tests/integration/crate_boundaries.rs` asserts this.

[workspace]
resolver = "2"
members = [
    "crates/chain-api",
    "crates/config",
    "crates/store",
    "crates/core",
    "crates/dispatcher",
    "crates/runtime",
    "crates/chains/evm",
    "bins/superquery-node",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0"
authors = ["SuperQuery contributors"]
repository = "https://github.com/blockSuperquery/superquery-node"

[workspace.dependencies]
# --- internal ---
superquery-chain-api = { path = "crates/chain-api" }
superquery-config = { path = "crates/config" }
superquery-store = { path = "crates/store" }
superquery-core = { path = "crates/core" }
superquery-dispatcher = { path = "crates/dispatcher" }
superquery-runtime = { path = "crates/runtime" }
superquery-chain-evm = { path = "crates/chains/evm" }

# --- third-party (versions verified on crates.io 2026-09-09, see task plan §5) ---
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

thiserror = "2.0"
anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"

# Postgres: raw SQL over tokio-postgres rather than sqlx — entity SQL is generated
# at runtime from each project's GraphQL schema, so sqlx's compile-time query
# checking does not apply. Rationale in the task plan §4.1.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"

graphql-parser = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
hex = "0.4"
sha2 = "0.10"

# Mapping sandbox (guide §3.5). 49.x is still an RC; pin the newest stable.
wasmtime = "48.0.1"

# Admin/metrics surface (guide Milestone 13).
axum = "0.8"
tower = "0.5"
prometheus-client = "0.25"

# EVM adapter — permitted ONLY in crates/chains/evm.
alloy = { version = "2.4", features = ["provider-http", "rpc-types-eth", "sol-types", "json-abi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
