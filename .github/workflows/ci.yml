name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in progress. Building wasmtime and alloy is the
# expensive part of every job, so not paying for it twice matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug info is the bulk of the target directory and nothing here reads it.
  # Smaller artifacts mean faster cache upload and download.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: fmt · clippy · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings are errors here. The workspace is clean today; keeping it that
        # way is nearly free, whereas letting it rot and cleaning up later is not.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        # Broken intra-doc links are how architecture documentation rots. This
        # already caught one during the initial scaffold.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superquery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        # The store's integration tests skip themselves when no database is
        # reachable, so DATABASE_URL is what makes them actually run. Without it
        # they would pass without touching Postgres and prove nothing.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/superquery
        run: cargo test --workspace --locked

      - name: Build the binary
        run: cargo build --bin superquery-node --locked

      - name: CLI smoke test
        # Proves the deliverable actually starts. `cargo test` compiles the binary
        # but never runs it.
        run: cargo run --bin superquery-node --locked -- --help
